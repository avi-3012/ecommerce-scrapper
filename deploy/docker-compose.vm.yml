# PricePulse — single-VM deploy (Azure/any Linux host) for a demo/MVP.
#
# Builds one image from deploy/Dockerfile.render (Playwright base, so the
# browser tier works) and runs db + a one-shot migrate/seed + api + worker.
# The API is published on host port 80 and serves the dashboard SPA too.
#
# Run from the repo root:
#   docker compose --env-file deploy/.env.vm -f deploy/docker-compose.vm.yml up -d --build
#
# HTTP-only demo on a bare IP: set COOKIE_SECURE=false in .env.vm so login
# works without HTTPS. Put a domain + TLS in front before real/production use.
#
# NOTE ON SCRAPING: there are no proxies any more — every request leaves from
# whatever IP this host has. On a cloud VM that is a DATACENTER IP, which the
# marketplaces treat far more harshly than a residential line. Run the worker
# on a residential connection; this file is fine for the API and dashboard.

name: pricepulse

x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile.render
  image: pricepulse-app:local
  env_file: .env.vm
  restart: unless-stopped
  volumes:
    # The identity pool: personas, their cookie jars, and the IP-level backoff
    # state. Identities are long-lived (weeks) and the API and worker draw from
    # the SAME pool, so both mount it — that shared filesystem is also what
    # makes the whole-IP request budget a single budget rather than two.
    - identities:/repo/data/identities
    # Live scraping config, so pool size / cycle / IP budget can be tuned and
    # the worker restarted without rebuilding the image.
    - ../config:/repo/config:ro

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 30

  # One-shot: apply migrations + seed the single user, then exit.
  migrate:
    <<: *app
    restart: 'no'
    command: sh -c "pnpm --filter @pricepulse/db migrate:deploy && pnpm --filter @pricepulse/db seed:prod"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    command: node apps/api/dist/main.js
    ports:
      # 80 on a real VM; override API_PORT locally where 80 is taken or
      # privileged (e.g. API_PORT=8081).
      - '${API_PORT:-80}:3000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: node apps/worker/dist/main.js
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  identities:
