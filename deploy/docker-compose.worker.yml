# PricePulse FLIPKART worker — runs on a connection Flipkart serves, not in AWS.
#
# Flipkart refuses AWS addresses on first contact, so its products are scraped
# by this separate worker from a connection Flipkart accepts: your home line.
# It scrapes Flipkart and nothing else. The AWS worker keeps Amazon, and each
# worker has its own identities, request budget and backoff, so a refusal from
# one marketplace can never slow the other.
#
# It is a SECONDARY worker: it only scrapes. Telegram, alert delivery and
# database housekeeping stay with the primary on AWS, which is what keeps two
# workers from sending every alert twice.
#
# It reaches the AWS database through an SSH tunnel opened on this machine
# (docs/FLIPKART-WORKER.md), so Postgres is never exposed to the internet.
#
# Run from the repo root on the home machine:
#   docker compose --env-file deploy/.env.worker -f deploy/docker-compose.worker.yml up -d --build

name: pricepulse-flipkart

services:
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.render
    image: pricepulse-app:local
    env_file: .env.worker
    restart: unless-stopped
    command: node apps/worker/dist/main.js
    environment:
      WORKER_MARKETPLACES: flipkart
      WORKER_ROLE: secondary
      # Row 1 is the AWS worker's. This one reports into its own row, so the
      # dashboard shows two workers rather than one that keeps changing its mind.
      WORKER_STATUS_ID: '2'
      # Flipkart's own pool size and request budget, sized for a home line.
      SCRAPING_CONFIG: /repo/config/scraping.flipkart.json
    # Reaches the SSH tunnel listening on the host's loopback.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      # The identity pool. Long-lived (weeks) — losing it means every persona is
      # brand new on an IP the marketplace already knows.
      - identities:/repo/data/identities
      # Live scraping config: tune pool size / cycle / budget and restart, no
      # rebuild.
      - ../config:/repo/config:ro

volumes:
  identities:
